# LanOS S.A.F.E —— Nginx 限速/限连（真正能挡 CC 的一层）
# 放在 http {} 里定义 zone，在 server {} 里启用。
# 说明：这是"按 IP 的速率限制"，对单机 CC 很有效；分布式 CC / DDoS 仍需 CDN。

# ---- http {} ----
# 每个 IP 平均 10 req/s，允许 20 个突发；共享内存 10MB 约可记 16 万个 IP
limit_req_zone  $binary_remote_addr zone=lanos_req:10m  rate=10r/s;
# 每个 IP 同时最多 20 个连接（挡慢速/连接耗尽）
limit_conn_zone $binary_remote_addr zone=lanos_conn:10m;

# 登录/注册接口单独收紧（防撞库）：平均 1 次/秒，突发 5
limit_req_zone  $binary_remote_addr zone=lanos_auth:5m  rate=1r/s;

# ---- server {} ----
limit_req  zone=lanos_req  burst=20 nodelay;
limit_req_status 429;
limit_conn lanos_conn 20;
limit_conn_status 429;

# 静态资源放宽，避免误伤
location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    limit_req zone=lanos_req burst=60 nodelay;
    expires 7d;
}

# 认证接口收紧
location ~ ^/(api/v1/)?auth/ {
    limit_req zone=lanos_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

# 超时：挡慢速攻击（slowloris）
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          10s;
keepalive_timeout     15s;
