# LanOS S.A.F.E —— Nginx 接入片段
# 1) 放在 http {} 里：真实 IP + JSON 日志格式
# 2) 放在站点 server {} 里：access_log 指向 lanos_json
#
# 真实 IP 段请用官方列表（会变）：
#   curl -s https://www.cloudflare.com/ips-v4 | sed 's/^/set_real_ip_from /; s/$/;/' >> /etc/nginx/conf.d/lanos-realip.conf

# ---- http {} 内 ----
log_format lanos_json escape=json
  '{"domain":"$host","ip":"$remote_addr","method":"$request_method",'
  '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"ua":"$http_user_agent","rt":$request_time}';

# Cloudflare 回源时，$remote_addr 是 CF 节点，必须用 CF-Connecting-IP 还原
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ---- server {} 内 ----
access_log /var/log/nginx/lanos_access.log lanos_json;

# 域名校验文件（Cloudflare 代理也能过，记得在 CF 里给它加白名单/绕缓存）
location = /.well-known/lanos-verify.txt {
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "把 App 里显示的校验串填在这里\n";
}
