# 名称：推送到 main 时自动构建 Android Debug APK
name: Build Android APK

# 触发条件：main 分支 push、打标签、或手动运行
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

# 授予 job 的最小权限（只读仓库内容）
permissions:
  contents: read

jobs:
  build:
    # 使用标准 Linux 构建机（已预装 Android SDK）
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 17（AGP 8.5 所需）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. 配置 Gradle 并利用缓存加速依赖下载
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 构建 Debug 版 APK（生成 app-debug.apk）
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # 5. 上传 APK 作为构建 Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # 若未生成 APK 则视为失败，避免静默通过
          if-no-files-found: error
