# 后端桌面版：多平台单文件可执行程序
# 触发：手动运行，或推送 v* 标签
name: Build desktop backend

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  binary:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            artifact: lanos-backend-linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            artifact: lanos-backend-linux-arm64
          - os: windows-latest
            name: windows-x64
            artifact: lanos-backend-windows-x64
          - os: macos-15-intel
            name: macos-x64
            artifact: lanos-backend-macos-x64
          - os: macos-latest
            name: macos-arm64
            artifact: lanos-backend-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Import check
        working-directory: backend
        run: python -c "import app.main; print('import ok', app.main.app.version)"

      - name: Build single-file binary
        working-directory: backend
        run: pyinstaller lanos-backend.spec --noconfirm --clean

      - name: List artifacts
        working-directory: backend
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/*
          if-no-files-found: error

  # 32 位 ARM：GitHub 没有 armv7 runner，用 QEMU 在容器里交叉构建（实验性）
  arm32:
    name: linux-arm32 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm/v7

      - name: Build inside arm32v7 container
        working-directory: backend
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src arm32v7/python:3.11-slim \
            bash -lc "pip install -r requirements.txt pyinstaller && pyinstaller lanos-backend.spec --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: lanos-backend-linux-arm32
          path: backend/dist/*
          if-no-files-found: warn
